<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
	GTK ignores font weights given by the user.
	This is "intentional" as they are "following CSS".
	https://gitlab.gnome.org/GNOME/gtk/-/work_items/2484

	Well, I follow my own rules. Let's make font weight selectable again.

	GTK/Pango parses the weight (Regular, Bold, Light, etc.) out of the font name.
	Let's prepend new font names that include the weight in a form GTK won't parse out.

	Note: These new names will show up in font pickers as Wxxx, where xxx:
		100: thin, 200: extralight, 300: light, 350: semilight, 400: regular, 500: medium
		600: demibold, 700: bold, 800: extrabold, 900: black, 950: extrablack
	Note: The old font names still work, they just won't show up in the font picker.
	Note: Each weight itself will have Bold/Italic/Bold-Italic variants for compatibility.

	Run `fc-cache -f` after installing.
	Caveat: If the system font cache regeneratres, system fonts lose their aliases.
	If that happens, do above command again as your user.
-->

<fontconfig>
	<!-- keep bold versions around -->
	<match target="scan">
		<test name="weight" compare="more_eq"><const>bold</const></test>
		<edit name="family" mode="append"><plus><name>family</name><string> W100</string></plus></edit>
		<edit name="family" mode="append"><plus><name>family</name><string> W200</string></plus></edit>
		<edit name="family" mode="append"><plus><name>family</name><string> W300</string></plus></edit>
		<edit name="family" mode="append"><plus><name>family</name><string> W350</string></plus></edit>
		<edit name="family" mode="append"><plus><name>family</name><string> W400</string></plus></edit>
		<edit name="family" mode="append"><plus><name>family</name><string> W500</string></plus></edit>
		<edit name="family" mode="append"><plus><name>family</name><string> W600</string></plus></edit>
	</match>

	<!-- business -->
	<match target="scan">
		<test name="weight" compare="eq"><const>thin</const></test>
		<edit name="family" mode="prepend"><plus><name>family</name><string> W100</string></plus></edit>
	</match>
	<match target="scan">
		<test name="weight" compare="eq"><const>extralight</const></test>
		<edit name="family" mode="prepend"><plus><name>family</name><string> W200</string></plus></edit>
	</match>
	<match target="scan">
		<test name="weight" compare="eq"><const>light</const></test>
		<edit name="family" mode="prepend"><plus><name>family</name><string> W300</string></plus></edit>
	</match>
	<match target="scan">
		<test name="weight" compare="eq"><const>semilight</const></test>
		<edit name="family" mode="prepend"><plus><name>family</name><string> W350</string></plus></edit>
	</match>
	<match target="scan">
		<test name="weight" compare="eq"><const>regular</const></test>
		<edit name="family" mode="prepend"><plus><name>family</name><string> W400</string></plus></edit>
	</match>
	<match target="scan">
		<test name="weight" compare="eq"><const>medium</const></test>
		<edit name="family" mode="prepend"><plus><name>family</name><string> W500</string></plus></edit>
	</match>
	<match target="scan">
		<test name="weight" compare="eq"><const>demibold</const></test>
		<edit name="family" mode="prepend"><plus><name>family</name><string> W600</string></plus></edit>
	</match>
	<match target="scan">
		<test name="weight" compare="eq"><const>bold</const></test>
		<edit name="family" mode="prepend"><plus><name>family</name><string> W700</string></plus></edit>
	</match>
	<match target="scan">
		<test name="weight" compare="eq"><const>extrabold</const></test>
		<edit name="family" mode="prepend"><plus><name>family</name><string> W800</string></plus></edit>
	</match>
	<match target="scan">
		<test name="weight" compare="eq"><const>black</const></test>
		<edit name="family" mode="prepend"><plus><name>family</name><string> W900</string></plus></edit>
	</match>
	<match target="scan">
		<test name="weight" compare="eq"><const>extrablack</const></test>
		<edit name="family" mode="prepend"><plus><name>family</name><string> W950</string></plus></edit>
	</match>
</fontconfig>
