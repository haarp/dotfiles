<touchégg>

<settings>
	<!-- Delay (in ms) between start of gesture and animation start. Default: 150 -->
	<property name="animation_delay">150</property>

	<!-- % gesture completion before execution. 0 = unconditionally. Default: 20 -->
	<property name="action_execute_threshold">5</property>

	<!-- Global animation colors (in HEX notation). Default: 3E9FED
		NOTE: You can override a specific animation color. `auto` also works. -->
	<property name="color">auto</property>
	<property name="borderColor">auto</property>
</settings>


<!-- xdotool notes:
	- Some windows (e.g. Firefox) ignore all keyboard input when not in focus
	- Other windows ignore SendEvent, which is used for `key --window`
	- xdotool sets `--window` automatically when one is in the stack
	- If SendEvented windows close quickly after Ctrl+w (e.g. Alacritty), xdotool crashes and never sends keyup
-->


<!-- Configuration for every application -->
<application name="All">

<!-- ** 2 Fingers ** -->
	<!-- Zoom In/Out -->
	<!--<gesture type="PINCH" fingers="2" direction="OUT">
		<action type="RUN_COMMAND">
			<repeat>true</repeat>
			<command>sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+KP_Add windowfocus $win'</command>
			<decreaseCommand>sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+KP_Subtract windowfocus $win'</decreaseCommand>
		</action>
	</gesture>
	<gesture type="PINCH" fingers="2" direction="IN">
		<action type="RUN_COMMAND">
			<repeat>true</repeat>
			<command>sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+KP_Subtract windowfocus $win'</command>
			<decreaseCommand>sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+KP_Add windowfocus $win'</decreaseCommand>
		</action>
	</gesture>-->


<!-- ** 3 Fingers ** -->
	<!-- Navigate Back/Forwards -->
	<!-- NOTE: MOUSE_CLICK doesn't support repeat or animation! -->
	<!-- NOTE: Animation swallows `xdotool click n` (https://github.com/JoseExposito/touchegg/issues/705) -->
	<gesture type="SWIPE" fingers="3" direction="LEFT">
		<action type="RUN_COMMAND">
			<repeat>false</repeat>
			<command>xdotool click 8</command>
			<decreaseCommand>xdotool click 9</decreaseCommand>
		</action>
	</gesture>
	<gesture type="SWIPE" fingers="3" direction="RIGHT">
		<action type="RUN_COMMAND">
			<repeat>false</repeat>
			<command>xdotool click 9</command>
			<decreaseCommand>xdotool click 8</decreaseCommand>
		</action>
	</gesture>

	<!-- Prev/Next Tab -->
	<gesture type="SWIPE" fingers="3" direction="UP">
		<action type="RUN_COMMAND">
			<repeat>false</repeat>
			<command>sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+Shift_L+Tab windowfocus $win'</command>
			<decreaseCommand>sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+Tab windowfocus $win'</decreaseCommand>
		</action>
	</gesture>
	<gesture type="SWIPE" fingers="3" direction="DOWN">
		<action type="RUN_COMMAND">
			<repeat>false</repeat>
			<command>sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+Tab windowfocus $win'</command>
			<decreaseCommand>sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+Shift_L+Tab windowfocus $win'</decreaseCommand>
		</action>
	</gesture>

	<!-- Refresh -->
	<gesture type="PINCH" fingers="3" direction="OUT">
		<action type="RUN_COMMAND">
			<repeat>false</repeat>
			<command>sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key F5 windowfocus $win'</command>
		</action>
	</gesture>


<!-- ** 4 Fingers ** -->
	<!-- Prev/Next workspace -->
	<gesture type="SWIPE" fingers="4" direction="LEFT">
		<action type="CHANGE_DESKTOP">
			<direction>previous</direction>
			<animate>true</animate>
			<color>3E9FED</color>
			<borderColor>3E9FED</borderColor>
		</action>
	</gesture>
	<gesture type="SWIPE" fingers="4" direction="RIGHT">
		<action type="CHANGE_DESKTOP">
			<direction>next</direction>
			<animate>true</animate>
			<color>3E9FED</color>
			<borderColor>3E9FED</borderColor>
		</action>
	</gesture>

	<!-- New/Close tab -->
	<!-- animation once again swallows xdotool -->
	<gesture type="SWIPE" fingers="4" direction="UP">
		<action type="RUN_COMMAND">
			<repeat>false</repeat>
			<on>end</on>
			<command>sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+t windowfocus $win'</command>
			<!--<animation>CHANGE_DESKTOP_UP</animation>-->
			<color>4AF853</color>
			<borderColor>4AF853</borderColor>
		</action>
	</gesture>
	<gesture type="SWIPE" fingers="4" direction="DOWN">
		<action type="RUN_COMMAND">
			<repeat>false</repeat>
			<on>end</on>
			<command>sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+w windowfocus $win'</command>
			<!--<animation>CHANGE_DESKTOP_DOWN</animation>-->
			<color>F84A53</color>
			<borderColor>F84A53</borderColor>
		</action>
	</gesture>

	<!-- Undo close tab -->
	<gesture type="PINCH" fingers="4" direction="OUT">
		<action type="RUN_COMMAND">
			<repeat>false</repeat>
			<command>sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+Shift_L+t windowfocus $win'</command>
		</action>
	</gesture>
</application>


<!-- Configuration for specific applications (use `xprop | grep WM_CLASS` to get name) -->
<application name="notused">
	<!-- ** 4 Fingers ** -->
	<!-- Maximize window -->
	<gesture type="SWIPE" fingers="4" direction="UP">
		<action type="MAXIMIZE_RESTORE_WINDOW">
			<animate>true</animate>
		</action>
	</gesture>
	<!-- Minimize window -->
	<gesture type="SWIPE" fingers="4" direction="DOWN">
		<action type="MINIMIZE_WINDOW">
			<animate>true</animate>
		</action>
	</gesture>
	<!-- Close window -->
	<gesture type="PINCH" fingers="4" direction="IN">
		<action type="CLOSE_WINDOW">
			<animate>true</animate>
			<color>F84A53</color>
			<borderColor>F84A53</borderColor>
		</action>
	</gesture>
	<!-- Show desktop -->
	<gesture type="PINCH" fingers="4" direction="OUT">
		<action type="SHOW_DESKTOP">
			<animate>true</animate>
		</action>
	</gesture>
	<!-- Left/Right workspace -->
	<gesture type="SWIPE" fingers="4" direction="LEFT">
		<action type="CHANGE_DESKTOP">
			<direction>auto</direction>
			<animate>true</animate>
			<animationPosition>auto</animationPosition>
		</action>
	</gesture>
	<gesture type="SWIPE" fingers="4" direction="RIGHT">
		<action type="CHANGE_DESKTOP">
			<direction>auto</direction>
			<animate>true</animate>
			<animationPosition>auto</animationPosition>
		</action>
	</gesture>
</application>

</touchégg>

