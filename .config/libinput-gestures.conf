# gesture <action> <motion> [finger_count] <command>
# action:
#	swipe up
#	swipe down
#	swipe left
#	swipe right
#	swipe left_up
#	swipe left_down
#	swipe right_up
#	swipe right_down
#	pinch in
#	pinch out
#	pinch clockwise
#	pinch anticlockwise
#	hold on (hold gesture available since libinput 1.19)
#	hold on+1.5 (another hold gesture, invoked after delay)
# command examples:
#	(non-shell-interpreted command and args)
#	_internal ws_up
#	_internal --cols 4 ws_up
#	_internal --cols 4 ws_left_up


### Settings
## Device Selector
#device foo
## Minimum travel distance in dots (default: 0)
swipe_threshold 30
## Timeout from start to end in secs (default: 1.5)
timeout 1.5

### Gestures
# xdotool notes:
# - Some windows (e.g. Firefox) ignore all keyboard input when not in focus
# - Other windows ignore SendEvent, which is used for `key --window`
# - xdotool set `--window` automatically when one is in the stack
# - If SendEvented windows close quickly after Ctrl+w (e.g. Alacritty), xdotool crashes and never sends keyup

## 3 Fingers
# Navigate back/forward
gesture swipe left 3 xdotool click 8
gesture swipe right 3 xdotool click 9
# Prev/Next tab
gesture swipe up 3 sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+Shift_L+Tab windowfocus $win'
gesture swipe down 3 sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+Tab windowfocus $win'
# Refresh
gesture hold on+0.2 3 sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key F5 windowfocus $win'

## 4 Fingers
# Prev/Next workspace
gesture swipe left 4 _internal ws_down
gesture swipe right 4 _internal ws_up
# New/Close tab
gesture swipe up 4 sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+t windowfocus $win'
gesture swipe down 4 sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+w windowfocus $win'
# Undo close tab
gesture hold on+0.2 4 sh -c 'win=$(xdotool getactivewindow); xdotool getmouselocation windowfocus; xdotool key Control_L+Shift_L+t windowfocus $win'
